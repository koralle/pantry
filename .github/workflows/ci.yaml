name: CI

on:
  pull_request:
    branches:
      - main
    # edited: base の付け替え（stack の下の PR が merge されたときなど）でも、新しい base
    # との差分で検査し直す。title / body の編集でも再実行される。
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# 同じ PR の古い実行は取り消す（push や edited が続いたときに最新の内容だけを検査する）。
#
# 注意: title / body だけの edited を job レベルの `if:` で skip しないこと。
# cancel-in-progress が有効なので、push 直後の本物の実行が edited の実行に取り消され、
# 同じ commit の必須チェックが skipped（= 成功扱い）だけになって、失敗を隠しうる。
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Check with Ultracite
        shell: bash
        run: |
          pnpm run check

  markuplint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Lint markup with markuplint
        shell: bash
        run: |
          pnpm markuplint "**/*.{tsx,jsx}" --format=github

  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Typecheck
        shell: bash
        run: |
          pnpm run typecheck

  migrations:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # PR の base（stack では下の PR のブランチ）との差分を取るため、履歴をすべて取得する。
          fetch-depth: 0

      # 本番に適用済みのマイグレーションは中身を一切変えない。差分は新しいフォルダで追加する。
      # base は PR が向いているブランチ（stacked PR では下の PR のブランチ）の先端。
      - name: Forbid changes to existing migrations
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # PR 自身がスクリプトを書き換えて検査を無効にできないよう、base にあれば base の版を使う。
        # base にまだ無いとき（このスクリプトを追加する PR 自身など）だけ PR の版を使う。
        run: |
          script=.github/scripts/forbid-existing-migration-changes.sh
          if git cat-file -e "$BASE_SHA:$script" 2>/dev/null; then
            echo "base（$BASE_SHA）の $script で検査します"
            git show "$BASE_SHA:$script" | bash -s -- "$BASE_SHA"
          else
            echo "::notice::base に $script が無いため、PR の版で検査します"
            bash "$script" "$BASE_SHA"
          fi

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Check Drizzle migrations
        shell: bash
        run: |
          pnpm --filter @pantry/db run check:migrations

  knip:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Knip
        shell: bash
        run: |
          pnpm run knip --reporter github-actions

  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Build
        shell: bash
        run: |
          pnpm run build

  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Test
        shell: bash
        run: |
          pnpm run test

  db-integration:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: DB integration tests
        shell: bash
        run: |
          pnpm run test:db
