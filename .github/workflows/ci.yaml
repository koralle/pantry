name: CI

on:
  pull_request:
    branches:
      - main
    # edited: base の付け替え（stack の下の PR が merge されたときなど）でも、新しい base
    # との差分で検査し直す。title / body の編集でも再実行される。
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# 同じ PR の古い実行は取り消す（push や edited が続いたときに最新の内容だけを検査する）。
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Check with Ultracite
        shell: bash
        run: |
          pnpm run check

  markuplint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Lint markup with markuplint
        shell: bash
        run: |
          pnpm markuplint "**/*.{tsx,jsx}" --format=github

  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Typecheck
        shell: bash
        run: |
          pnpm run typecheck

  migrations:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # PR の base（stack では下の PR のブランチ）との差分を取るため、履歴をすべて取得する。
          fetch-depth: 0

      # 本番に適用済みのマイグレーションは中身を一切変えない。差分は新しいフォルダで追加する。
      # base は PR が向いているブランチ（stacked PR では下の PR のブランチ）の先端。
      - name: Forbid changes to existing migrations
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          .github/scripts/forbid-existing-migration-changes.sh "$BASE_SHA"

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Check Drizzle migrations
        shell: bash
        run: |
          pnpm --filter @pantry/db run check:migrations

  knip:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Knip
        shell: bash
        run: |
          pnpm run knip --reporter github-actions

  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Build
        shell: bash
        run: |
          pnpm run build
        env:
          # Placeholder values so varlock can validate the schema during CI builds.
          TURSO_CONNECTION_URL: http://127.0.0.1:8080
          TURSO_AUTH_TOKEN: ci-placeholder-token
          BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32chars
          BETTER_AUTH_URL: http://localhost:3000

  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Test
        shell: bash
        run: |
          pnpm run test

  persistence-integration:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/composite-actions/cache-and-install

      - name: Persistence Integration tests
        shell: bash
        run: |
          pnpm run test:persistence
