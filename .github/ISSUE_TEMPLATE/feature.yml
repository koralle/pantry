name: Feature
description: 新しい振る舞い・画面・フローを追加する
labels: [feature]
body:
  - type: textarea
    id: goal
    attributes:
      label: やりたいこと
      description: 何を追加・変更したいか
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 完了とみなせる条件
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: design-doc
    attributes:
      label: Design doc
      description: 任意。docs/superpowers/specs/ へのパス
      placeholder: docs/superpowers/specs/YYYY-MM-DD-topic-design.md
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: スコープ外
      description: 任意。今回やらないこと
    validations:
      required: false
