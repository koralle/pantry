name: Chore
description: リファクタ、CI、依存更新、インフラなどの作業
labels: [chore]
body:
  - type: textarea
    id: what
    attributes:
      label: 何をするか
      description: 具体的な作業内容
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: なぜ今やるか
      description: やる理由・緊急性
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影響範囲
      description: 任意。触るパッケージ、CI、デプロイなど
    validations:
      required: false
