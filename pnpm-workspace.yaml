  - "@better-auth/telemetry@1.6.16"
  - better-auth@1.6.16
  - ultracite@7.11.0

overrides:
  "@babel/core>semver": 7.8.0
  "@babel/helper-compilation-targets>semver": 7.8.0
  "@tanstack/query-core": 5.100.11
  chokidar: 5.0.0
  kysely: 0.28.17
  esbuild: 0.28.1
  # The preview's pkg.pr.new subdependencies are incompatible with strict pnpm installs.
  "@cloudflare/vitest-plugin>miniflare": 5.20260908.0-alpha
  "@cloudflare/vitest-plugin>wrangler": 4.130.0

saveExact: true

strictDepBuilds: true

trustPolicy: no-downgrade
