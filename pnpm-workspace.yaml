packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  cpu-features: false
  esbuild: true
  lefthook: true
  protobufjs: false
  sharp: true
  ssh2: false
  workerd: true

catalog:
  react-scan: 0.5.7

catalogMode: strict

catalogs:
  authentication:
    "@better-auth/drizzle-adapter": 1.7.18
    "@better-auth/passkey": 1.7.18
    better-auth: 1.7.18
  build:
    "@cloudflare/vite-plugin": 1.67.0
    "@vitejs/plugin-react": 6.2.1
    "vite": 8.3.6
  database:
    "@libsql/client": 0.18.0
    "@tursodatabase/database": 0.8.3
    drizzle-orm: 1.0.0-rc.5
    drizzle-kit: 1.0.0-rc.5
    drizzle-seed: 1.0.0-rc.5
  date:
    "@internationalized/date": 3.12.4
  debug:
    "@tanstack/devtools-vite": 0.8.6
    "@tanstack/react-devtools": 0.10.14
    "@tanstack/react-query-devtools": 5.106.1
    "@tanstack/react-router-devtools": 1.167.2
  errors:
    "@praha/error-factory": 1.4.1
    "react-error-boundary": 6.1.6
  form:
    "@conform-to/react": 1.21.3
    "@conform-to/valibot": 1.21.3
  format:
    oxfmt: 0.76.0
  framework:
    "@tanstack/react-query": 5.106.1
    "@tanstack/react-router": 1.170.46
    "@tanstack/react-router-ssr-query": 1.167.3
    "@tanstack/react-start": 1.169.4
  githooks:
    lefthook: 2.1.10
  lint:
    "@markuplint/jsx-parser": 4.18.4
    "@markuplint/react-spec": 4.18.4
    knip: 6.44.1
    markuplint: 4.18.5
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2006
    ultracite: 7.12.4
  react:
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    react: 19.3.0
    react-dom: 19.3.0
  runtime:
    "@types/node": 25.9.9
    wrangler: 4.158.0
  script:
    tsx: 4.23.15
  server:
    hono: 4.13.16
  test:
    "@cloudflare/vitest-plugin": 1.6.0
    testcontainers: 12.2.1
    vitest: 5.1.0
  typescript:
    "@tsconfig/strictest": 2.0.8
    typescript: 7.0.2
  storybook:
    "@storybook/addon-docs": 10.6.6
    "@storybook/builder-vite": 10.6.6
    "@storybook/tanstack-react": 10.6.6
    storybook-device-viewports: 0.1.2
    storybook: 10.6.6
  ui:
    "@fontsource/noto-sans-jp": 5.3.1
    "@pandacss/dev": 1.12.2
    "@pandacss/mcp": 1.12.2
    lucide-react: 1.69.0
    postcss: 8.5.32
    react-aria-components: 1.22.1
  uuid:
    uuidv7: 1.2.1
  validation:
    valibot: 1.5.0
  rpc:
    "@orpc/client": 1.16.1
    "@orpc/contract": 1.16.1
    "@orpc/server": 1.16.1
    "@orpc/tanstack-query": 1.16.1

engineStrict: true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.6.16"
  - "@better-auth/drizzle-adapter@1.6.16"
  - "@better-auth/kysely-adapter@1.6.16"
  - "@better-auth/memory-adapter@1.6.16"
  - "@better-auth/mongo-adapter@1.6.16"
  - "@better-auth/prisma-adapter@1.6.16"
  - "@better-auth/telemetry@1.6.16"
  - better-auth@1.6.16
  - ultracite@7.11.0
  - "@cloudflare/vitest-plugin@1.4.5"
  - miniflare@5.20261012.1-beta || 5.20261019.0-beta
  - wrangler@4.151.1 || 4.151.2
  - "@cloudflare/workerd-darwin-64@1.20261019.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261019.1"
  - "@cloudflare/workerd-linux-64@1.20261019.1"
  - "@cloudflare/workerd-linux-arm64@1.20261019.1"
  - "@cloudflare/workerd-windows-64@1.20261019.1"
  - workerd@1.20261019.1

overrides:
  "@babel/core>semver": 7.8.0
  "@babel/helper-compilation-targets>semver": 7.8.0
  "@tanstack/query-core": 5.100.11
  chokidar: 5.0.0
  kysely: 0.28.17
  esbuild: 0.28.1

saveExact: true

strictDepBuilds: true

trustPolicy: no-downgrade
