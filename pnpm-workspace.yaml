allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

catalogMode: strict

catalogs:
  authentication:
    '@better-auth/drizzle-adapter': 1.6.25
    better-auth: 1.6.25
  build:
    '@cloudflare/vite-plugin': 1.47.0
    '@vitejs/plugin-react': 6.0.4
    'vite': 8.1.5
  database:
    '@libsql/client': 0.17.4
    '@tursodatabase/database': 0.7.1
    drizzle-orm: 1.0.0-rc.4
    drizzle-kit: 1.0.0-rc.4
    drizzle-seed: 1.0.0-rc.4
  debug:
    '@tanstack/devtools-vite': 0.8.3
    '@tanstack/react-devtools': 0.10.9
    '@tanstack/react-query-devtools': 5.101.4
    '@tanstack/react-router-devtools': 1.167.0
  envvars:
    '@dotenvx/dotenvx': 1.75.1
    '@t3-oss/env-core': 0.13.11
  errors:
    '@praha/error-factory': 1.4.1
    'react-error-boundary': 6.1.2
  form:
    '@formisch/react': 0.8.0
  format:
    oxfmt: 0.60.0
  framework:
    '@tanstack/react-query': 5.101.4
    '@tanstack/react-router': 1.170.18
    '@tanstack/react-router-ssr-query': 1.167.1
    '@tanstack/react-start': 1.168.32
  githooks:
    lefthook: 2.1.10
  lint:
    knip: 6.29.0
    oxlint: 1.75.0
    oxlint-tsgolint: 0.25.0
  react:
    '@types/react': 19.2.17
    '@types/react-dom': 19.2.3
    react: 19.2.8
    react-dom: 19.2.8
  runtime:
    '@types/node': 25.9.5
    wrangler: 4.114.0
  script:
    tsx: 4.23.1
  test:
    '@cloudflare/vitest-pool-workers': 0.18.8
    vitest: 4.1.10
  typescript:
    '@tsconfig/strictest': 2.0.8
    typescript: 7.0.2
  storybook:
    '@storybook/builder-vite': 10.5.4
  ui:
    '@base-ui/react': 1.6.0
    '@pandacss/dev': 1.11.5
    lucide-react: 1.26.0
    postcss: 8.5.22
  uuid:
    uuidv7: 1.2.1
  validation:
    valibot: 1.4.2

engineStrict: true

minimumReleaseAgeExclude:
  - '@better-auth/core@1.6.16'
  - '@better-auth/drizzle-adapter@1.6.16'
  - '@better-auth/kysely-adapter@1.6.16'
  - '@better-auth/memory-adapter@1.6.16'
  - '@better-auth/mongo-adapter@1.6.16'
  - '@better-auth/prisma-adapter@1.6.16'
  - '@better-auth/telemetry@1.6.16'
  - better-auth@1.6.16

overrides:
  '@babel/core>semver': 7.8.0
  '@babel/helper-compilation-targets>semver': 7.8.0
  '@tanstack/query-core': 5.100.11
  chokidar: 5.0.0
  kysely: 0.28.17
  esbuild: 0.28.1

saveExact: true

strictDepBuilds: true

trustPolicy: no-downgrade
