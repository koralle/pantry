packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  cpu-features: false
  esbuild: true
  lefthook: true
  protobufjs: false
  sharp: true
  ssh2: false
  workerd: true

catalogMode: strict

catalogs:
  authentication:
    "@better-auth/drizzle-adapter": 1.7.26
    "@better-auth/passkey": 1.7.26
    better-auth: 1.7.26
  build:
    "@cloudflare/vite-plugin": 1.70.1
    "@vitejs/plugin-react": 6.3.0
    "vite": 8.3.8
  database:
    "@libsql/client": 0.18.0
    "@tursodatabase/database": 0.8.3
    drizzle-orm: 1.0.0-rc.5
    drizzle-kit: 1.0.0-rc.5
    drizzle-seed: 1.0.0-rc.5
  date:
    "@internationalized/date": 3.12.4
  debug:
    "@tanstack/devtools-vite": 0.8.7
    "@tanstack/react-devtools": 0.10.15
    "@tanstack/react-query-devtools": 5.108.1
    "@tanstack/react-router-devtools": 1.167.4
  errors:
    "@praha/error-factory": 1.4.1
    "react-error-boundary": 6.1.6
  form:
    "@conform-to/react": 1.21.3
    "@conform-to/valibot": 1.21.3
  format:
    oxfmt: 0.79.0
  framework:
    "@tanstack/react-query": 5.108.1
    "@tanstack/react-router": 1.170.46
    "@tanstack/react-router-ssr-query": 1.167.3
    "@tanstack/react-start": 1.169.7
  githooks:
    lefthook: 2.1.10
  lint:
    "@interfere/landmines": 0.1.1
    "@markuplint/jsx-parser": 4.18.4
    "@markuplint/react-spec": 4.18.4
    eslint-plugin-storybook: 10.6.7
    knip: 6.46.1
    markuplint: 4.18.5
    oxlint: 1.94.0
    oxlint-plugin-react-doctor: 0.9.23
    react-doctor: 0.9.23
    tsrs: 7.1.0-beta.tsrs3
    ultracite: 8.3.1
  react:
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    react: 19.3.0
    react-dom: 19.3.0
  runtime:
    "@types/node": 25.9.9
    wrangler: 4.165.0
  script:
    tsx: 4.23.15
  server:
    hono: 4.13.19
  test:
    "@cloudflare/vitest-plugin": 1.8.5
    "@vitest/browser-playwright": 5.1.1
    playwright: 1.65.1
    testcontainers: 12.2.2
    vitest: 5.1.1
    vitest-browser-react: 2.3.0
  typescript:
    "@tsconfig/strictest": 2.0.9
    typescript: 7.0.2
  storybook:
    "@storybook/addon-docs": 10.6.7
    "@storybook/builder-vite": 10.6.7
    "@storybook/tanstack-react": 10.6.7
    storybook-device-viewports: 0.1.2
    storybook: 10.6.7
  ui:
    "@fontsource/noto-sans-jp": 5.3.1
    "@pandacss/dev": 1.12.3
    "@pandacss/mcp": 1.12.3
    lucide-react: 1.76.0
    postcss: 8.5.33
    react-aria-components: 1.22.1
  uuid:
    uuidv7: 1.2.1
  validation:
    valibot: 1.5.0
  rpc:
    "@orpc/client": 1.16.4
    "@orpc/contract": 1.16.4
    "@orpc/server": 1.16.4
    "@orpc/tanstack-query": 1.16.4

engineStrict: true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.6.16"
  - "@better-auth/drizzle-adapter@1.6.16"
  - "@better-auth/kysely-adapter@1.6.16"
  - "@better-auth/memory-adapter@1.6.16"
  - "@better-auth/mongo-adapter@1.6.16"
  - "@better-auth/prisma-adapter@1.6.16"
  - "@better-auth/telemetry@1.6.16"
  - better-auth@1.6.16
  - ultracite@8.3.1
  - "@cloudflare/vitest-plugin@1.4.5"
  - miniflare@5.20261012.1-beta || 5.20261019.0-beta
  - wrangler@4.151.1 || 4.151.2
  - "@cloudflare/workerd-darwin-64@1.20261019.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261019.1"
  - "@cloudflare/workerd-linux-64@1.20261019.1"
  - "@cloudflare/workerd-linux-arm64@1.20261019.1"
  - "@cloudflare/workerd-windows-64@1.20261019.1"
  - workerd@1.20261019.1

overrides:
  "@babel/core>semver": 7.8.0
  "@babel/helper-compilation-targets>semver": 7.8.0
  "@tanstack/query-core": 5.100.11
  chokidar: 5.0.0
  kysely: 0.28.17
  esbuild: 0.28.1

saveExact: true

strictDepBuilds: true

trustPolicy: no-downgrade
# tsrs は oxc-project の beta（provenance が無く no-downgrade で止まる）。
trustPolicyExclude:
  - "tsrs@7.1.0-beta.tsrs3"
