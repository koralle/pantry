pre-commit:
  piped: true
  jobs:
    - name: Fix with Ultracite
      glob:
        - "**/*.js"
        - "**/*.cjs"
        - "**/*.mjs"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.cts"
        - "**/*.mts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
        - "**/*.scss"
        - "**/*.md"
        - "**/*.mdx"
        - "**/*.yaml"
        - "**/*.yml"
        - "**/*.html"
      run: |
        pnpm run fix -- {staged_files}
      stage_fixed: true

    - group:
        parallel: true
        jobs:
          - name: Lint markup with markuplint
            glob:
              - "**/*.{tsx,jsx}"
            run: |
              pnpm markuplint {staged_files} --allow-warnings

          - name: Typecheck
            glob:
              - "**/*.{ts,tsx}"
            run: |
              pnpm run typecheck

pre-push:
  commands:
    betterleaks:
      run: betterleaks git . --no-banner -v
    knip:
      run: pnpm run knip

post-checkout:
  commands:
    symlink-env-for-worktree:
      run: pnpm tsx scripts/symlink-env-for-worktree.ts
