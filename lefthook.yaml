pre-commit:
  piped: true
  jobs:
    - name: Format with Oxfmt
      run: |
        pnpm oxfmt {staged_files} --write --no-error-on-unmatched-pattern
      stage_fixed: true

    - group:
        parallel: true
        jobs:
          - name: Lint with Oxlint
            run: |
              pnpm oxlint {staged_files} --fix --no-error-on-unmatched-pattern
            stage_fixed: true

          - name: Typecheck
            glob:
              - '**/*.{ts,tsx}'
            run: |
              pnpm run typecheck

pre-push:
  commands:
    betterleaks:
      run: betterleaks git . --no-banner -v
    knip:
      run: pnpm run knip

post-checkout:
  commands:
    symlink-env-for-worktree:
      run: pnpm tsx scripts/symlink-env-for-worktree.ts
